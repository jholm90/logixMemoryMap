# Task/Program/Routine SHELL decomposition (WIRED 2026-08-27, OQ item "Per-
# Task overhead" in docs/OPEN_QUESTIONS.md). fixed_base_per_routine (4816,
# above) is a real, KNOWN, hundreds-of-times-confirmed constant for the
# BASELINE case (1 Task, 1 Program, 1 plain routine, 0 rungs) -- but it was
# being applied ONCE PER EMITTED ROUTINE regardless of Task/Program
# structure, which over-predicts any file with more than one plain routine
# (a 2-plain-routine/1-program/1-task file doesn't cost 2x4816 of shell, it
# costs 4816 + a much smaller marginal routine cost). This block is that
# marginal cost, split into three independent axes and applied ONCE per
# file total (see report.py) as: fixed_base_per_routine (once, whenever the
# file has >=1 plain routine) + task_extra*(n_tasks-1) +
# program_extra*(n_programs-1) + routine_extra*(n_plain_routines-1).
#
# Derivation -- solved from 5 real files, all exact or near-exact, no
# theoretical/assumed baseline used anywhere in the solve:
# `programoverhead_n02progs_1task` (1 task/2 programs/2 routines, actual
# 18,900) minus `taskoverhead_n02routines_1program_1task` (1 task/1
# program/2 routines, actual 18,416) holds task AND routine count IDENTICAL
# between the two files, varying ONLY program count -- a real, isolated
# **program_extra = +484**, no assumptions. `taskoverhead_n02tasks` (2
# tasks/2 programs/2 routines, actual 19,600) minus the program-overhead
# file above holds program AND routine count IDENTICAL, varying ONLY task
# count -- **task_extra = +700**, same isolation. routine_extra solved
# directly against `taskoverhead_n02routines_1program_1task` itself (1
# task, 1 program, 2 routines, 2 NOP rungs): actual(18,416) = project_
# baseline(13,296) + fixed_base_per_routine(4,816, ONCE) + routine_extra*
# (2-1) + 2*NOP(16 each, unrelated rung-content cost, unchanged/separate
# mechanism) => **routine_extra = 272**. This is the fix the 2026-08-26
# "why am I having to push you" note called for: earlier attempts anchored
# the routine-shell subtraction on a THEORETICAL 0-rung reference and
# risked conflating real NOP rung content with routine-shell cost; this
# derivation instead anchors on the already-KNOWN, real fixed_base_per_
# routine and handles rung content via the existing, unchanged, separate
# per-rung mechanism -- no double-counting.
#
# Verified against all 3 real disentangle-batch files exactly (0 residual)
# AND against the original taskoverhead_n02/n03/n04tasks sweep (each Task
# gets its own Program+Routine+1 rung): n=2 exact, n=3 exact, n=4 off by
# only +48 (0.21%) -- a small, already-flagged, unexplained periodic-task
# residual, not chased further.
#
# Deliberately does NOT touch the separately-validated JSR pathway: a
# JSR-caller routine keeps charging jsr_fixed_base_per_routine exactly as
# before (report.py only applies this new decomposition when the file has
# at least one PLAIN, non-JSR-involved routine to anchor the once-per-file
# shell on -- a file whose only routines are JSR callers/targets is
# untouched, same as before this fix). A file mixing JSR-caller routines
# WITH plain routines across a multi-Task/multi-Program structure is
# untested territory -- flagged, not guessed at.
task_program_overhead:
  routine_extra: 272
  program_extra: 484
  task_extra: 700
  confidence: FITTED

