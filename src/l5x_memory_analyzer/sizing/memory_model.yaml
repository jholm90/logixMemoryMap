# Machine-readable mirror of docs/MEMORY_MODEL.md.
#
# docs/MEMORY_MODEL.md is the authored source of truth (formulas, rationale,
# confidence discussion). This file holds the same numbers in a form the sizing
# engine can load directly. When a constant changes during Phase 3/4 validation,
# update BOTH files in the same commit -- do not let them drift.

atomic_types:
  SINT: { bytes: 1, confidence: KNOWN }
  INT: { bytes: 2, confidence: KNOWN }
  DINT: { bytes: 4, confidence: KNOWN }
  LINT: { bytes: 8, confidence: KNOWN }
  REAL: { bytes: 4, confidence: KNOWN }
  # Unsigned counterparts -- James, 2026-08-30, real gap found reviewing a
  # confidential customer project (not committed, never named here): "UINT
  # is the same as INT with the last bit being unsigned and disabling the
  # INT from having a negative value. you should assume INT/UINT are the
  # same size SINT/USINT same size DINT/UDINT same size." Same storage
  # width as the signed type, sign interpretation only -- ULINT follows
  # the same rule (not explicitly named by James, but that project's own
  # logic used a UDT with ULINT members directly, same pattern).
  USINT: { bytes: 1, confidence: KNOWN }
  UINT: { bytes: 2, confidence: KNOWN }
  UDINT: { bytes: 4, confidence: KNOWN }
  ULINT: { bytes: 8, confidence: KNOWN }

# Firmware-native structure types referenced by name in L5X (never appear in
# Controller/DataTypes -- there's no member list to recurse, Logix Designer
# just resolves them internally). Only the ones with a well-documented fixed
# layout go here; see docs/MEMORY_MODEL.md and docs/OPEN_QUESTIONS.md
# OQ-PREDEFINED for everything else found in real samples (MESSAGE, PID,
# AXIS_CIP_DRIVE, motion/safety structures) that's NOT safe to guess at.
predefined_structures:
  # TIMER/COUNTER/CONTROL share the same documented 3-DINT layout: one DINT
  # of packed status bits (EN/TT/DN for TIMER; CU/CD/DN/OV/UN for COUNTER;
  # EN/EU/DN/EM/ER/UL/IN/FD for CONTROL) + PRE (DINT) + ACC/POS (DINT).
  TIMER: { bytes: 12, confidence: KNOWN }
  COUNTER: { bytes: 12, confidence: KNOWN }
  CONTROL: { bytes: 12, confidence: KNOWN }
  # Motion/axis predefined structures -- derived 2026-08-23 from the
  # 2026-08-22 real-capture batch (gen_axis_composite.py/gen_motion_
  # predefined.py "*_only" isolation files), which previously all failed
  # to size at all (SizeError, OQ-PREDEFINED). Each file wraps exactly one
  # unmodeled tag alongside the newly-confirmed empty_project_baseline
  # below and the (also real, exact) per-tag overhead formula -- pure
  # structure cost = actual_bytes - empty_project_baseline - tag_overhead
  # (- MotionGroup's own cost too, for the 4 Axis/CoordinateSystem files,
  # which always also declare a MotionGroup tag it depends on). FITTED,
  # single-sample-each -- not a count sweep, so no independent
  # cross-check the way TIMER/COUNTER/CONTROL's documented layout gets;
  # treat as a solid real measurement, not yet KNOWN-grade.
  MOTION_GROUP: { bytes: 1076, confidence: FITTED }
  AXIS_CIP_DRIVE: { bytes: 22636, confidence: FITTED }
  COORDINATE_SYSTEM: { bytes: 9516, confidence: FITTED }
  AXIS_SERVO: { bytes: 16796, confidence: FITTED }
  AXIS_VIRTUAL: { bytes: 16796, confidence: FITTED }
  # MOTION_INSTRUCTION: exact match (0 residual) across 1/5/50-tag count
  # sweep once empty_project_baseline + tag_overhead are subtracted --
  # same 12-byte size as TIMER/COUNTER/CONTROL, plausibly the same
  # 3-DINT-status-structure convention. FITTED pending a documented-layout
  # citation to promote to KNOWN.
  MOTION_INSTRUCTION: { bytes: 12, confidence: FITTED }
  # SFC/FBD-family native structures, James (2026-08-27): "You should know
  # all of those native instructions data types." Not derived from a
  # documentation citation -- read directly off REAL Decorated-XML L5K
  # data in James's own corpus (SJ_Gormley_20251112_r02.L5X, Bender134053_
  # 201104.L5X, BAI10048_TrimmerTally_20250704.L5X, BT1XX_FFC_20240325.L5X)
  # the same way TIMER's own real shape would be read: each real instance's
  # <Data Format="L5K"> raw value array length x 4 bytes IS the real total
  # (one DINT per raw L5K scalar -- exactly how TIMER's 3-element/12-byte
  # L5K array already confirms that convention). Zero variance across
  # every real instance checked (272/272 SFC_STEP, 97/97 SFC_ACTION, 5/5
  # FBD_TIMER, 4/4 FBD_ONESHOT, 2/2 FBD_MATH -- RATE_LIMITER/SCALE only
  # 1 real instance each so far). ASSUMED, not KNOWN -- real and
  # zero-variance, but not yet independently confirmed against an actual
  # controller memory-capture delta the way TIMER/COUNTER/CONTROL are.
  # Not drillable to a per-field breakdown yet (sizing/tree.py's
  # _THREE_FIELD_PREDEFINED set) -- only the TOTAL is confirmed this way,
  # not a per-field byte attribution.
  SFC_STEP: { bytes: 28, confidence: ASSUMED }   # Status+PRE+T+TMax+Count+LimitLow+LimitHigh = 7 DINT
  SFC_ACTION: { bytes: 16, confidence: ASSUMED } # Status+PRE+T+Count = 4 DINT
  FBD_TIMER: { bytes: 48, confidence: ASSUMED }  # 12 DINT-equivalent (bools packed in)
  FBD_ONESHOT: { bytes: 12, confidence: ASSUMED } # 3 DINT-equivalent
  FBD_MATH: { bytes: 16, confidence: ASSUMED }   # EnableIn/Out packed + SourceA/B/Dest REAL = 4 DINT
  RATE_LIMITER: { bytes: 92, confidence: ASSUMED } # 23 DINT-equivalent, n=1 real sample
  SCALE: { bytes: 52, confidence: ASSUMED }      # 13 DINT-equivalent, n=1 real sample
  # SFC_STOP -- found 2026-08-28 re-checking the corpus after a regex bug
  # (didn't account for a <Description> block between Tag-open and Data)
  # hid this real evidence on the first pass (James: "did a super in-depth
  # memory analysis... it doesn't seem like you analyzed it enough"). Real
  # Decorated members: Status(DINT)+X(BOOL)+Reset(BOOL)+Count(DINT), but
  # the real L5K array has 5 raw values -- [8193,0,0,0,0], zero variance
  # across all 4 real instances (Stop_014/Stop_046/Seq_Stop_015/Seq_
  # Stop_069, Bender134053_201104.L5X). L5K[0]=8193=16#2001 matches the
  # real Status value exactly. One more raw value than named Decorated
  # members -- a hidden field not shown in the Decorated view, same
  # "voodoo" pattern already documented for CAM_PROFILE (only 1 of 14 real
  # per-element fields visible there). 5 x 4 bytes = 20, same convention
  # as SFC_STEP/SFC_ACTION. ASSUMED, zero-variance across 4 instances, not
  # yet capture-confirmed.
  SFC_STOP: { bytes: 20, confidence: ASSUMED }   # Status+X+Reset+Count+1 hidden = 5 DINT-equivalent
  # FBD_BOOLEAN_AND/OR/NOT -- RM018A pages 546-548 give the real member
  # list (AND/OR: EnableIn+In1..In8+EnableOut+Out = 11 BOOL; NOT:
  # EnableIn+In+EnableOut+Out = 4 BOOL), but unlike SFC_STEP the real L5K
  # array does NOT scale 1-value-per-field -- all 3 real corpus instances
  # (BAND_01/BNOT_02/BOR_01, Bender134053_201104.L5X) show exactly 3 raw
  # L5K values regardless of member count. Bit-level decode against the
  # real Decorated-XML values on the SAME instances confirms the packing
  # exactly (not guessed): L5K[0] = input word, bit0=EnableIn, bit(n)=InN
  # (BAND_01 real bits EnableIn=1,In1=0,In2=0,In3..In8=1 -> 1+8+16+32+64+
  # 128+256=505, matches real L5K[0]=505 exactly; BOR_01 EnableIn=1,In1=1,
  # rest 0 -> 1+2=3, matches real L5K[0]=3). L5K[1] = output word, bit0=
  # EnableOut, bit1=Out (BAND_01 EnableOut=1,Out=0 -> 1, matches; BOR_01/
  # BNOT_02 EnableOut=1,Out=1 -> 3, matches both). L5K[2] is an identical
  # REAL constant (5.60519386e-045) across every instance of every type --
  # a fixed reserved/uninitialized field, not user data. 3 fields x 4
  # bytes = 12, same flat shape as TIMER/COUNTER/CONTROL/MOTION_
  # INSTRUCTION. ASSUMED (real, zero-variance across 2 distinct member-
  # count shapes with exact bit-level reproduction; not yet capture-
  # confirmed). Not added to sizing/tree.py's _THREE_FIELD_PREDEFINED --
  # the 3 real fields are bit-packed words, not named Status/PRE/ACC-style
  # members, so there's no real per-field drill target to expose.
  FBD_BOOLEAN_AND: { bytes: 12, confidence: ASSUMED }
  FBD_BOOLEAN_OR: { bytes: 12, confidence: ASSUMED }
  FBD_BOOLEAN_NOT: { bytes: 12, confidence: ASSUMED }
