# Machine-readable mirror of docs/MEMORY_MODEL.md.
#
# docs/MEMORY_MODEL.md is the authored source of truth (formulas, rationale,
# confidence discussion). This file holds the same numbers in a form the sizing
# engine can load directly. When a constant changes during Phase 3/4 validation,
# update BOTH files in the same commit -- do not let them drift.

atomic_types:
  SINT: { bytes: 1, confidence: KNOWN }
  INT: { bytes: 2, confidence: KNOWN }
  DINT: { bytes: 4, confidence: KNOWN }
  LINT: { bytes: 8, confidence: KNOWN }
  REAL: { bytes: 4, confidence: KNOWN }

# Firmware-native structure types referenced by name in L5X (never appear in
# Controller/DataTypes -- there's no member list to recurse, Logix Designer
# just resolves them internally). Only the ones with a well-documented fixed
# layout go here; see docs/MEMORY_MODEL.md and docs/OPEN_QUESTIONS.md
# OQ-PREDEFINED for everything else found in real samples (MESSAGE, PID,
# AXIS_CIP_DRIVE, motion/safety structures) that's NOT safe to guess at.
predefined_structures:
  # TIMER/COUNTER/CONTROL share the same documented 3-DINT layout: one DINT
  # of packed status bits (EN/TT/DN for TIMER; CU/CD/DN/OV/UN for COUNTER;
  # EN/EU/DN/EM/ER/UL/IN/FD for CONTROL) + PRE (DINT) + ACC/POS (DINT).
  TIMER: { bytes: 12, confidence: KNOWN }
  COUNTER: { bytes: 12, confidence: KNOWN }
  CONTROL: { bytes: 12, confidence: KNOWN }
  # Motion/axis predefined structures -- derived 2026-08-23 from the
  # 2026-08-22 real-capture batch (gen_axis_composite.py/gen_motion_
  # predefined.py "*_only" isolation files), which previously all failed
  # to size at all (SizeError, OQ-PREDEFINED). Each file wraps exactly one
  # unmodeled tag alongside the newly-confirmed empty_project_baseline
  # below and the (also real, exact) per-tag overhead formula -- pure
  # structure cost = actual_bytes - empty_project_baseline - tag_overhead
  # (- MotionGroup's own cost too, for the 4 Axis/CoordinateSystem files,
  # which always also declare a MotionGroup tag it depends on). FITTED,
  # single-sample-each -- not a count sweep, so no independent
  # cross-check the way TIMER/COUNTER/CONTROL's documented layout gets;
  # treat as a solid real measurement, not yet KNOWN-grade.
  MOTION_GROUP: { bytes: 1076, confidence: FITTED }
  AXIS_CIP_DRIVE: { bytes: 22636, confidence: FITTED }
  COORDINATE_SYSTEM: { bytes: 9516, confidence: FITTED }
  AXIS_SERVO: { bytes: 16796, confidence: FITTED }
  AXIS_VIRTUAL: { bytes: 16796, confidence: FITTED }
  # MOTION_INSTRUCTION: exact match (0 residual) across 1/5/50-tag count
  # sweep once empty_project_baseline + tag_overhead are subtracted --
  # same 12-byte size as TIMER/COUNTER/CONTROL, plausibly the same
  # 3-DINT-status-structure convention. FITTED pending a documented-layout
  # citation to promote to KNOWN.
  MOTION_INSTRUCTION: { bytes: 12, confidence: FITTED }

# Predefined structures whose real cost is base + per_element*array_length
# rather than a flat scalar -- CAM_PROFILE is always used as an array in
# real Logix (a cam profile IS a point array). Derived 2026-08-23 from
# gen_motion_predefined.py's 1/5/20/50-element real count sweep: exact
# linear fit (0 residual) once empty_project_baseline + tag_overhead
# subtracted. per_element=56 = 14 fields x 4 bytes, matching the earlier
# corpus finding (OQ-PREDEFINED) that only 1 of 14 real per-element L5K
# fields is visible in the Decorated XML -- this empirical fit independently
# confirms that field count.
predefined_array_structures:
  CAM_PROFILE: { base: 4, per_element: 56, confidence: FITTED }
  # CAM (used by MCCP/MAPC's cam-profile operand -- NOT CAM_PROFILE, a
  # different predefined structure with a different real shape, see the
  # CAM_PROFILE entry above and OPEN_QUESTIONS.md OQ-PREDEFINED item 8).
  # Wired 2026-08-26 from gen_cam_sweep.py's real 5-point count sweep
  # (n=1/5/10/20/50, error_count=0 throughout): exact at n=1 and n=5, a
  # flat -4 (already-familiar small universal noise, seen throughout this
  # project) at n=10/20/50 -- clean enough for KNOWN. Matches the
  # mechanistic prediction made before this data existed: CAM's own L5K
  # format shows no hidden fields (unlike CAM_PROFILE), so a clean
  # base+12*count (not CAM_PROFILE's much larger 56/element, which DOES
  # hide fields) was the expected shape, now confirmed.
  CAM: { base: 8, per_element: 12, confidence: KNOWN }

# Fixed per-project overhead the sizing engine never modeled before
# 2026-08-23 -- controller/module/task/program scaffolding that exists in
# every real Capacity-tab reading regardless of tag/UDT/logic content, so
# every engine total silently under-predicted real actual_bytes by this
# exact amount. Derived by cross-checking this engine's own fresh
# recomputation (not the possibly-stale predicted_bytes column already
# sitting in manifest.csv) against actual_bytes for every clean real data
# point in the 2026-08-22/23 capture batch: the gap is EXACTLY 13,296
# across 200+ independent points spanning wildly different categories
# (tag_overhead sweeps, UDT-name sweeps, tagscope, boolarray, udtarrayalign,
# comment-length sweeps) with zero variance -- not a fitted average, a
# literal constant. A handful of categories (the 244-file logic-instruction
# sweep, customstring, array-of-odd-UDT) show a small +4 to +206 ADDITION on
# top of this same 13,296 floor, each independently explained elsewhere in
# this file (customstring_definition_cost, the logic-instruction weight
# table's own fixed_base_per_routine) -- 13,296 is the true floor, not an
# average across those.
empty_project_baseline:
  bytes: 13296
  confidence: KNOWN

# Per-module overhead (2026-08-27, OQ-MODULEIO, James's own methodology:
# compare a module's auto-generated "Module-Defined" data type -- the raw
# member-sum of its InputTag/OutputTag/ConfigTag Structure content, exactly
# like sizing any other UDT -- against its real captured Capacity delta).
# FITTED from only 2 real points so far, flagged LOW CONFIDENCE deliberately
# -- see docs/OPEN_QUESTIONS.md OQ-MODULEIO for the full derivation and why
# more points are needed before trusting this as a real formula:
#   1756-IB16: module_defined_bytes=28, real actual=1712 -> overhead=1684
#   1734-AENTR/C: module_defined_bytes=36, real actual=1696 -> overhead=1660
# Both land within 24 bytes of each other despite very different module
# types (a 16-pt digital backplane module vs a 14-slot Point I/O Ethernet
# adapter) and very different module_defined_bytes (28 vs 36) -- the
# overhead doesn't obviously track the module's own I/O content size, so a
# flat constant (the mean of the 2 points) is the current best estimate,
# NOT a confirmed per-connection or per-point rate. Applied ONCE per
# module (not per Connection) until more data says otherwise.
module_overhead:
  bytes: 1672
  confidence: FITTED

bool:
  # Standalone BOOL controller/program tags: allocated as a full DINT, not
  # bit-packed. See OQ-BOOLPACK -- ASSUMED, pending Phase 3 confirmation.
  standalone_tag_bytes: 4
  standalone_confidence: ASSUMED
  # BOOL members inside a UDT pack 8-per-byte into a hidden backing SINT.
  # L5X encodes this explicitly (hidden SINT member + visible BIT-alias
  # members with Target/BitNumber), so the parser reads it directly rather
  # than re-deriving it -- these constants are what the parser expects to
  # find, not values it computes.
  member_bits_per_backing_byte: 8
  member_backing_type: SINT
  member_confidence: KNOWN
  # BOOL *array* tags (distinct from standalone BOOL tags above) bit-pack
  # 32-per-DINT-sized-word. See OQ-BOOLARRAY -- ASSUMED, not yet validated.
  array_bits_per_packed_word: 32
  array_packed_word_bytes: 4
  array_confidence: ASSUMED

string:
  # Built-in STRING: 4-byte LEN (DINT) + 82-byte DATA (SINT[82]) default.
  len_field_bytes: 4
  default_data_bytes: 82
  confidence: KNOWN
  # Custom string types (user DataTypes with Family="StringFamily"): same
  # 4-byte LEN, DATA length taken from the type's own definition.
  custom_confidence: KNOWN
  # One-time DataType-definition cost for a custom STRING type, separate
  # from and additive with the instance cost above -- resolves
  # OQ-CUSTOMSTRINGDEF. The ordinary udt_definition formula doesn't apply
  # (excluded in report.py, is_string_family check); this project docs
  # already estimated "~204-208 blocks" from a partial re-analysis.
  # Derived 2026-08-23 from the real 7-point customstring_len* count sweep
  # (maxlen 10 to 2000) against empty_project_baseline + tag_overhead:
  # constant 206 (+/-2, consistent with the small per-file tag-name-length
  # bucket rounding seen elsewhere, not real variation) across every
  # maxlen tested -- confirms the type-definition cost doesn't scale with
  # DATA length, only the instance does (as expected: LEN+DATA[N] is a
  # fixed 2-member shape regardless of N). Not yet tested for type-NAME-
  # length sensitivity (every sample used a similar-length type name) --
  # flagged, not assumed independent.
  # Re-derived 2026-08-25 alongside the nearest-8 padding fix above: the
  # original 206 was fit against the OLD (unpadded) instance formula, so
  # it silently absorbed part of the padding error into the "definition
  # cost" bucket. With the instance formula now correct, real data shows
  # a flat +2 one-time term the padding fix doesn't itself cover --
  # consistently +2 at every count point (n=1/100/1000) for every maxlen
  # NOT in the mod4==1 bucket (which gets its own separate +8 instead, see
  # custom_mod4eq1_definition_bonus below), not growing with count.
  # 206+2=208. KNOWN: confirmed exact across all 9 real maxlen points,
  # spanning type names of 6/7/10/14 characters, all landing on this exact
  # flat value with zero residual -- 208 is correct and NOT dependent on
  # type-name length across that range.
  #
  # 2026-08-26, real effect found at the EXTREMES, NOT wired (see
  # OQ-CUSTOMSTRINGTYPENAME): `gen_string_closure.py`'s
  # group_typename_length (short=1 char/medium=9 char/long=32 char, same
  # maxlen=100, all error_count=0) shows delta-from-208 of -8/0/+24. A
  # simple ceil(name_len/8) or floor(name_len/8) step function was tried
  # and REJECTED -- it predicts a nonzero delta for the already-confirmed
  # 6/7/14-char names too (all of which are genuinely flat 0), which is
  # directly contradicted by real data. The true relationship isn't a
  # clean function of the 6 points collected so far: real name lengths
  # 6-14 chars all sit on a flat plateau (0), while 1 char is cheaper
  # (-8) and 32 chars is more expensive (+24) -- looks like a real effect
  # only at the extremes, but nothing here should be wired off 6 points
  # with no clean pattern. Needs more lengths (2/3/4, 16/20/24) to
  # characterize properly before touching code again.
  #
  # SOLVED 2026-08-26, James: "I want to close strings." gen_string_
  # close_out.py's dense sweep (every name length 1-16 plus 20/24/28/32/
  # 36/40, maxlen=100 fixed) landed: 22/22 points exact fit a clean step
  # function, `base + bucket * floor((name_len - offset) / bucket)` with
  # offset=5, bucket=8 -- e.g. length 1-4 -> -8, 5-12 -> 0 (this is the
  # already-confirmed flat-208 zone, matches the old 6/7/14-char "flat 0"
  # finding for lengths 6,7 exactly; 14 lands in the NEXT bucket at +8,
  # which is real, not a contradiction -- the earlier note's "14 is flat"
  # claim was never actually re-verified against a maxlen=100-matched
  # data point, it was inferred from a different maxlen's single sample).
  # Cross-checked against `gen_string_close_out.py`'s UDT-member-nesting
  # crosscheck (the SAME 3 type names -- 1/9/32 chars -- reused as UDT
  # members instead of standalone tags): all 3 back out the IDENTICAL
  # implied baseline (18720), proving the name-length term is exactly the
  # same whether the type is used standalone or nested -- no separate
  # "UDT nesting tax" exists, resolving OQ-STRINGUDTMEMBER's custom100
  # mystery flat "+8" in passing (16-char name -> bucket 13-20 -> +8,
  # exactly matches). KNOWN.
  custom_definition_base: 208
  custom_definition_namelen_offset: 5
  custom_definition_namelen_bucket: 8
  custom_definition_confidence: KNOWN
  # Built-in STRING tags cost exactly 2 bytes LESS than the ordinary flat
  # tag_overhead formula predicts -- resolves OQ-STRINGTAGOVERHEAD.
  # Confirmed 2026-08-25 via the dense `stringoverhead_builtin_n*` sweep
  # (9 count points, 1 to 1000): gap = actual - engine is EXACTLY -2*n at
  # every single point (n=1:-2, n=2:-4, n=5:-10 ... n=1000:-2000), and the
  # `stringoverhead_namelen*_n050` cross-check (name length 4/8/16/40,
  # fixed count=50) shows the identical -100 (=-2*50) regardless of name
  # length -- confirms this is a flat per-tag correction independent of
  # both count and name length, not a name-length-bucket artifact.
  # NOT extended to custom StringFamily types: those don't need a
  # tag_overhead correction at all -- the apparent per-tag rate difference
  # seen for custom strings turned out to be entirely explained by the
  # nearest-8 DATA-padding rule below, not a separate STRING-vs-custom-
  # string tag_overhead effect (see custom_data_padding_multiple).
  builtin_tag_overhead_correction: -2
  builtin_tag_overhead_correction_confidence: KNOWN
  # Custom StringFamily instance size: 2026-08-25 real-bug fix + full
  # derivation, found while chasing the "maxlen mod 4" residual James
  # flagged as needing 100% closure -- CONFIRMED KNOWN now, not a guess.
  # The DATA array member (SINT[maxlen]) was being sized RAW (maxlen
  # bytes, no rounding at all). Real mechanism: DATA rounds to the
  # NEAREST multiple of 8, rounding DOWN at the exact tie (remainder 4)
  # -- implemented as "pad to 4, then if that lands exactly at the 8-byte
  # midpoint, drop back by 4." Verified EXACT (0 residual) against all 9
  # real maxlen points spanning every mod-4 and mod-8 remainder tested
  # (49, 50, 51, 100, 101, 300, 500, 501, 1000) -- e.g. maxlen=50 and
  # maxlen=51 measure BYTE-IDENTICAL real memory at every count tested
  # (both round to the same 48-byte block), while maxlen=100 (pads to
  # 100, a 4-mod-8 tie) drops to 96, and maxlen=101 (pads to 104, already
  # 0-mod-8) stays at 104. No separate per-tag correction constant is
  # needed at all -- this one rule fully explains the real per-tag rate
  # at every tested maxlen from 49 to 1000.
  custom_data_padding_multiple: 4
  # maxlen mod 4 == 1 ALSO gets a separate, CONFIRMED +8 one-time
  # DEFINITION-cost bonus (3/3 real points exact: 49, 101, 501) -- this is
  # independent of the per-tag padding rule above (both act at the same
  # time for a mod4==1 type: the padding rule gets the per-tag rate right,
  # this bonus gets the one-time definition-level intercept right).
  # Applied in report.py by checking the DATA member's own dimension mod
  # 4, not a separate scalar here (needs per-type maxlen to decide).
  custom_mod4eq1_definition_bonus: 8
  # maxlen=1000 (the largest maxlen tested) fits the nearest-8 padding
  # rule exactly with no anomaly: 1000 is already a multiple of 8, so no
  # rounding adjustment applies, and (being mod4==0, not mod4==1) it
  # correctly gets no definition bonus either -- resolved as part of the
  # same derivation, not a separate open question. KNOWN, not FITTED:
  # 9/9 real data points fit exactly with zero residual.
  custom_data_padding_confidence: KNOWN

# Array-of-STRING (OQ-STRINGARRAYPAD, wired 2026-08-26, James: "I want
# strings as a whole closed"). A DIFFERENT real mechanism from the scalar
# case above -- array elements do NOT get the scalar tag's -2/tag benefit,
# and instead carry their own real, additive, per-element AND one-time
# array-level cost on top of the already-correct N x (scalar element size).
#
# Builtin STRING array: CONFIRMED KNOWN, 6/6 real count points (n=1/5/10/
# 25/50/100) exactly fit `array_base(6) + per_element(2) * n` with ZERO
# residual at every single point -- as clean a fit as any formula in this
# project.
#
# Custom-string array: per-element rate CONFIRMED KNOWN at 4/element --
# 6/6 real points across TWO different type names (11-char "CStrArrTest"
# and 13-char "CStrArrCsTest", both maxlen=100) land on the identical
# slope=4/rung with zero variance. The ONE-TIME array_base term is FITTED
# not KNOWN and genuinely type-name-length-dependent -- the two type names
# above give array_base=4 and =12 respectively (a consistent flat +8 gap
# between them, same order of magnitude as the already-documented, still-
# unresolved custom-string type-NAME-length effect on the scalar
# definition cost, see the `string:` block above). custom_array_base below
# uses the 13-char name's value (12) since it's backed by 4 real points
# vs the 11-char name's 2 -- expect a real, small (~8-byte), name-length-
# dependent residual for other type names until that axis is closed too.
string_array:
  builtin_confidence: KNOWN
  builtin_array_base: 6
  builtin_per_element: 2
  custom_confidence: FITTED
  custom_array_base: 12
  custom_per_element: 4

udt:
  # No alignment/padding between members -- tight packing, declared order.
  # Confirmed 2026-08-22 (OQ-ALIGN, RESOLVED_QUESTIONS.md): James's own
  # field-experience call, 100% confident, and every real UDT test across
  # the whole sweep (dozens of samples) landed on predictions consistent
  # with tight-packing. Was UNKNOWN, now KNOWN.
  alignment_confidence: KNOWN

array:
  # dimension x element_size, no padding ambiguity for atomic element types.
  atomic_confidence: KNOWN
  # dimension x udt_size -- padding treatment (per-element vs whole-block)
  # not yet resolved. See OQ-ARRAYPACK (test built 2026-08-22, awaiting
  # capture) -- still genuinely open, do not flip this without real data.
  udt_confidence: UNKNOWN

# Array-of-AOI-instances: a real, DIFFERENT formula from plain array-of-UDT
# above -- confirmed 2026-08-26 across 4 total member counts (10/20/30/60),
# 15 real data points, exact fit throughout. Per-instance marginal cost
# is NOT simply (scalar instance size, 4-byte rounded) -- it's the scalar
# size minus a flat 4-byte "array" discount, minus 4 bytes for every BOOL
# member (a real cross-member packing benefit -- an AOI array element's
# BOOL params pack together the way a plain BOOL array packs 32-per-word),
# with a further +4 correction every time the BOOL member count within
# ONE instance crosses a 32-member boundary. Formula (per instance, on top
# of compute_udt_size's own already-correct SCALAR AOI-instance size):
#   let scalar = compute_udt_size(aoi_type)  [already includes EnableIn/
#     EnableOut + every Input/Output/LocalTag member, BOOL counted as a
#     flat 4 bytes each -- the existing, separately-confirmed KNOWN #1
#     scalar formula, unchanged]
#   bool_count = number of declared members (Input/Output/LocalTags,
#     NOT counting EnableIn/EnableOut) with DataType="BOOL"
#   if bool_count == 0: per_instance = scalar - array_flat_discount
#   else: per_instance = scalar - array_flat_discount - bool_count*4
#         + 4*max(0, ceil(bool_count/32) - 1)
# Verified exact against all 15 real points across mc=10/20/30/60 and the
# original 6-ratio/4-count mc=30 sweep this was first found on. Also
# confirmed 2026-08-26: BOOL member LAYOUT (grouped-first, grouped-last,
# interspersed with non-BOOL) does NOT change this per-instance rate --
# boolfirst and boollast measure byte-identical, interspersed measures the
# identical marginal rate too. Layout DOES add a flat +16 one-time
# (definition-level, not per-instance) cost for interspersed vs grouped --
# separate finding, not yet wired (small, definition-cost-bucket effect,
# same undecided architecture question as OQ-AOIDEF).
aoi_array:
  flat_discount: 4
  bool_word_size: 32
  bool_word_extra: 4
  confidence: KNOWN

# AOI *definition* cost (the AOI's own Parameters/LocalTags declaration,
# separate from any tag that instantiates it) -- OQ-AOIDEF, wired 2026-08-26
# after James's "fix this" push on Phase 2/2b's UI drill-down items. Real
# data: the local-tag-count sweep (localcount_n01/02/04/08/16/32_def_only)
# and the param-count sweep (paramcount_n01/02/04/08/16/32_def_only) each
# landed on the IDENTICAL formula independently -- base+20*n, exact at
# n=4/8/16/32 (n=1/2 sit a few blocks under, same small-N noise pattern
# documented elsewhere in this project) -- strong agreement across two
# independent axes for a single flat per-declared-item rate. base=1184
# is relative to this engine's existing empty_project_baseline+fixed_base_
# per_routine floor (18128 in both sweeps' own real Capacity readings).
# declared_item_count = every Input/Output Parameter (InOut excluded, same
# reference-not-storage convention as udt.py's own AOI-array member count)
# plus every LocalTag, EXCLUDING the always-present EnableIn/EnableOut.
#
# CONFIDENCE IS FITTED, NOT KNOWN, DELIBERATELY.
#
# 2026-08-27: per-type rate table wired (was flat 20/item for every type).
# The full localtype_*/paramtype_*/aoidefcost_type* def_only batch landed
# captured (85/85 AOI rows in manifest.csv) -- this had been sitting
# captured but unprocessed. Live-recomputed against the current engine (see
# docs/OPEN_QUESTIONS.md OQ-AOIDEF for the derivation): holding
# declared_item_count fixed and varying only the item TYPE, per-item rate is
# clean and near-exact (base=1184 held constant, only the per-item rate
# moves) for AOIs where every declared item is the SAME type:
#   BOOL=16, SINT=18, INT=18, DINT=20 (unchanged), REAL=20, LINT=24
# per_type_rate below overrides per_declared_item for exactly that case
# (single-type-only AOI defs) -- see AoiDefinitionModel.bytes_for.
#
# MIXED-type AOI defs (the realistic case: some DINT + some BOOL + some
# REAL, etc) deliberately still use the flat per_declared_item=20 rate, NOT
# a per-type sum. Real data proves the per-type rates do NOT compose
# additively once BOOL sits alongside another type: aoi_boolpack_
# interspersed20_def_only (20 BOOL + 20 DINT) matches the flat-20 formula
# EXACTLY (0 residual) but a per-type sum (16*20+20*20) UNDER-predicts by
# 80. aoi_boolpack_clean_alternating/grouped_def_only (10 BOOL + 10 DINT,
# same total count, different BOOL/DINT arrangement) land on a DIFFERENT
# actual value from each other despite identical composition -- position/
# packing-order-sensitive, not a simple type-count effect. This is a real,
# confirmed, currently-unmodeled interaction (not a data gap -- more
# samples of the same shape won't resolve it, it needs a genuinely
# different formula), so mixed-type AOI defs deliberately keep the old
# uniform rate rather than risk a worse prediction from a naive per-type
# sum. BasicAOI/RealisticAOI50 (realistic mixed shapes) already sit within
# 1-2% under the flat rate -- leaving mixed-type alone is not a regression.
#
# Still NOT folded in (real, open, both small: <2% of total file bytes at
# the extremes tested):
# - AOI name length: aoiname_len08/13/20/30_def_only (identical DINT:4
#   composition, only the AOI's own type name varies) shows a real but
#   non-uniform stepping (+0/+8/+16/+32 blocks, not the clean 8*ceil(len/8)
#   the UDT/tag_overhead formulas use) -- not force-fit, flagged as residual.
# - Required/Visible/Hidden flag combination's small +-16 definition-cost
#   swing (see OQ-AOIDEF) -- recapture batch (reqvis_*_def_only against a
#   BOOL+InOut AXIS shape) still awaiting capture, not yet re-confirmed.
aoi_definition:
  base: 1184
  per_declared_item: 20
  per_type_rate:
    BOOL: 16
    SINT: 18
    INT: 18
    LINT: 24
  confidence: FITTED

# Per-tag flat overhead: every top-level <Tag> entry (Controller/Tags or
# Program/Tags) costs this ON TOP OF its own raw data size (from
# atomic_types/predefined_structures/udt/array above) -- confirmed
# 2026-08-20/21, RESOLVED_QUESTIONS.md OQ-TAGOVERHEAD: exact fit across 16
# independent data points (13-point DINT-50-tag count sweep + 3-point
# REAL-40-tag cross-check), plus a separate 8/8-point count sweep from 5 to
# 1000 tags landing on exactly the same per-tag constant at name_length=8 --
# two independently-derived measurements agreeing exactly is why this is
# KNOWN, not FITTED. Tag names are stored in 8-character-aligned chunks.
# Does NOT yet apply to Alias tags (TagType="Alias") -- that's OQ-ALIASSIZE,
# still open, test built, awaiting capture; alias tags stay at 0 total until
# that lands, don't guess it's the same formula.
tag_overhead:
  flat_base: 84
  per_8_chars: 8  # bucket = floor(name_length / 8)
  confidence: KNOWN

# Alias tags (TagType="Alias") -- previously assumed 0 bytes ("pointer, no
# storage"). Real data (OQ-ALIASSIZE, resolved 2026-08-25) via
# aliassize_n00001/n00010/n01000 proves this wrong: an Alias tag has the
# same per-Tag-entry-in-the-tag-table overhead shape as an ordinary tag
# (flat_base + per_8_chars*floor(namelen/8)), just with a smaller flat_base
# -- no separate raw-data-size term, since an Alias has no data space of its
# own, only a tag-table pointer entry. Confirmed exact at n=1/10/1000 across
# 3 name-length buckets (56, 560, 63200 exact gap match).
alias_overhead:
  flat_base: 56
  per_8_chars: 8
  confidence: KNOWN

# UDT DataType *definition* cost -- a ONE-TIME cost per distinct UDT type
# actually referenced (not per instance/tag), separate from and additive
# with tag_overhead above (which is per-Tag) and the tight-packed member
# size (used for instance/array sizing). Confirmed 2026-08-20/21,
# RESOLVED_QUESTIONS.md OQ-TAGOVERHEAD: definition_base + per_member exact
# fit at 4/8/16/32 all-DINT declared members; name_base + name_per_8_chars
# exact fit at name lengths 8/13/20/30 (4 DINT members held constant).
# member_count for both formulas is the DECLARED member count (as a user
# would count them), NOT the raw <Member> XML element count -- a run of N
# BOOL members still only counts as N declared members even though Logix
# Designer's XML adds a hidden backing SINT per 8-bit chunk underneath.
# bool_run_bonus is a flagged, less-certain empirical adjustment: a
# separate type-cross-check sweep (4 members, one sample each of SINT/INT/
# DINT/LINT/REAL/BOOL) measured 240 for the non-BOOL types and 272 for
# BOOL -- the +32 gap is confirmed, but 240 doesn't reconcile exactly
# against definition_base + per_member*4 = 232 the way the dedicated
# count-sweep's points do (an 8-block residual between two different
# sample files never fully re-verified). Use the formula below for
# member_count, add bool_run_bonus flat if any declared member is BOOL,
# and treat that specific case as carrying a small known residual rather
# than pretending perfect precision.
udt_definition:
  # CORRECTED 2026-08-22, same day as first landed: originally implemented
  # as base(168) + per_member*count PLUS SEPARATELY name_base(224) +
  # name_per_8_chars*ceil(name_len/8), added together -- caught by cross-
  # checking every real udt-category manifest row against this engine's
  # prediction (every *_def_only row over-predicted by a consistent
  # ~224-232 blocks). The two original "168" and "224+..." formulas were
  # each independently exact-fit against their own sweep (member-count
  # sweep held name_length=8 fixed; name-length sweep held member_count=4
  # fixed), but they're two different 1-D slices through the SAME 2-
  # variable surface, both including the same shared base -- adding them
  # double-counts it. Solved simultaneously instead: one true base of 160,
  # confirmed exact against every real udtmembers_n*/udtname_len* data
  # point for member_count>=4 (n=1,2 keep the same small-N anomaly already
  # documented for tag count).
  base: 160
  per_member: 16
  name_per_8_chars: 8  # bucket = ceil(name_length / 8), NOT floor -- different from tag_overhead
  bool_run_bonus: 32
  confidence: KNOWN

# Logic instruction weights -- FITTED, 2026-08-22. delta_blocks = fixed_base
# + weight * rung_count, fit from the 244-file per-instruction sweep
# (gen_logic_sweep.py), 0.00% residual on every instruction listed. See
# docs/MEMORY_MODEL.md "Logic instruction weights" for the full derivation
# and caveats. fixed_base is charged ONCE PER ROUTINE by this engine's
# current implementation -- flagged explicitly: every source sample had
# exactly 1 Task/1 Program/1 Routine, so whether this cost is really
# per-routine, per-program, or per-task specifically is NOT yet
# disambiguated (gen_task_overhead.py is the pending test for this).
# Treat multi-routine/multi-program predictions as FITTED, not KNOWN, for
# that reason on top of the regression-fit reason alone.
#
# CORRECTED 2026-08-22, same day as first landed: several of these sweep
# files don't contain ONLY the named instruction -- e.g. XIC's rung text is
# literally "XIC(tag)OTE(tag);", not "XIC(tag);" alone, because a bare XIC
# can't legally close a rung. The RAW measured weight for those files is
# the COMBINED cost of the instruction plus its closing companion (usually
# OTE, once XIC+ONS+OTE for ONS specifically), not a clean isolated weight
# for the named instruction alone. Caught by cross-checking this engine's
# own prediction against real captured data for instr_xic_n01000 (engine
# said 40,816; real delta was 24,816 -- summing the raw XIC weight AND the
# raw OTE weight for every rung double-counted OTE, since both instructions
# are really in every one of those rungs). Every weight below is now the
# isolated per-instruction-alone value, decomposed using OTE's own clean
# 16 (its sweep file, "OTE(tag);", never had a companion) as the anchor --
# e.g. raw XIC-file measurement was 20 = XIC_alone + OTE(16), so
# XIC_alone = 4. This makes the table properly additive: summing each
# instruction's own weight by its occurrence count in a rung, however many
# different instructions that rung actually contains, reconstructs the
# right total instead of over- or under-counting shared companions. Not
# yet independently confirmed by real data at the composed level -- that's
# exactly what gen_logic_random_mix.py's random-combination batch tests.
# CPT's real cost, wired 2026-08-26 (OQ-CMPCPTLAYOUT, James's explicit
# top priority) -- REPLACES the old flat "CPT: 452" weight, which was
# proven wrong 2026-08-23 (fit against exactly one complex expression
# shape from the original calibration sweep, not CPT's actual cost --
# real data shows CPT's per-call cost is expression-complexity-dependent).
# parser/logic.py now extracts each real CPT(...) call's operator tokens;
# sizing/logic.py costs each call via CptExpressionModel.cost_for below
# instead of the flat per-mnemonic weights table CPT used to sit in.
#
# Derivation, all from samples/manifest.csv cmpcpt_*/cptcx_* real data,
# error_count=0 throughout:
# - base_read (a bare "CPT(dest,tag)", no operator at all): 88/call.
#   Solved from cmpcpt_cpt_barecopy's n=10/n=100 points (88.0/rung exact,
#   both give the same fixed-baseline intercept) -- NOT from the n=1000
#   point, which sits exactly 264 blocks below the n=10/n=100-implied
#   linear extrapolation. That -264 gap recurs identically (same
#   magnitude, only at n=1000) across several unrelated file shapes in
#   this sweep -- a real, separate, still-unexplained large-file-size
#   threshold effect (not a CPT-specific mechanism), NOT the true per-rung
#   rate. n=10/n=100 are the clean, uncontaminated points.
# - operator_tier_costs: ADD/SUB=36, MUL/DIV/MOD=52, POW=116 -- each
#   confirmed via the SAME n=10/n=100 method on cmpcpt_cpt_op_{add,sub,
#   mul,div,mod,pow}, all landing on a clean flat rate with zero residual
#   at both count points (e.g. ADD: 124/rung both n=10->n=100 and matches
#   88+36 exactly).
# - per_extra_same_tier_operand: 24 -- from cptcx_operandcount_n01..n10
#   (single-rung files, operand count 1-10, same ADD operator throughout):
#   1st extra operand (1->2 operands) costs the full tier rate (36), EVERY
#   operand after that costs a flat 24 (confirmed exact at every step
#   2->3->4->5->6->8->10). Cross-checked against the n=1000 chain-length
#   sweep (chain3/4/5/6/8/10): this formula predicts chain3/4/5/8/10 with
#   ZERO residual; chain6 alone shows the same -264 large-file anomaly
#   described above (not a formula error -- every OTHER chain length at
#   the same n=1000 matches exactly).
# - Literal operands (int): CONFIRMED to cost the SAME as a tag operand --
#   op_add_intliteral vs op_add is byte-IDENTICAL at n=10 and n=100 (the
#   apparent "+264 for a literal operand" in this project's older notes
#   was a misdiagnosis of the same n=1000 large-file anomaly above, not a
#   real literal-operand cost; corrected here).
# - Float literals: NOT confirmed, deliberately excluded from this model.
#   The only real float-literal data uses REAL-typed tag operands, not
#   DINT, confounding "float literal cost" with "REAL operand-type cost"
#   (OQ-OPERANDTYPE, separately real and separately unwired) -- no clean
#   DINT-vs-DINT+float-literal comparison exists yet.
# - Mixed-tier expressions (e.g. A+B*C, more than one distinct operator
#   tier present): cost_for() falls back to a plain additive sum of each
#   operator's own tier cost -- confirmed a WEAK approximation, not a
#   trustworthy one, by 3 real data points spanning a wide complexity
#   range:
#     * cptcx_operatormix_mixedops/_nested (L0+L1-L2*L3, 3 operators,
#       2 tiers): additive sum over-predicts by 20 bytes/call (small).
#     * cptcx_operatormix_powermix (L0**L1+L2**L3, 3 operators, 2 tiers):
#       additive sum over-predicts by 20 bytes/call too (same magnitude,
#       consistent at least with itself).
#     * instr_cpt_n* real corpus expression ((D0+D1)*R1-R2/2+1.5, 5
#       operators across 3 tiers, REAL-typed operands, a literal divisor,
#       and a float literal all at once): additive sum (300/call) UNDER-
#       predicts the real ~452/call rate by ~150 bytes/call -- this is
#       almost certainly the exact expression the OLD flat-452 constant
#       was originally fit against (explains the suspicious near-exact
#       match to the very number this whole rewrite replaced). A 150-byte
#       miss on a 5-operator/3-tier/mixed-literal/REAL-operand expression
#       is a real, large gap, not noise.
#   Root cause not isolated: this one expression stacks several untested
#   interactions at once (multi-tier mixing, a literal in a non-leading
#   position, REAL-typed operands per the separate open OQ-OPERANDTYPE,
#   and a float literal) -- no way from 3 data points to tell which
#   factor(s) drive the 150-byte gap. Deliberately NOT patched by fitting
#   a 4th constant to this one point -- that would repeat the exact
#   mistake this project already caught and reverted once this session
#   (a formula fit to too few points that broke on the fuller dataset).
#   Needs a dedicated mixed-operator test batch (tier-pair sweep, isolate
#   literal position, isolate REAL-vs-DINT) before this branch can be
#   trusted the way the uniform case now is. Treat any CPT-heavy real
#   program with genuinely mixed-tier expressions as still ESTIMATED in
#   the loosest sense -- the uniform case is the one that earned "exact."
# - CMP's own compound-condition cost (AND/OR/duplicate boolean
#   conditions) is a DIFFERENT token set (comparison + boolean operators,
#   not arithmetic) and is deliberately NOT touched by this change --
#   CMP's existing flat weight below has its own unresolved inconsistency
#   found while deriving this (the compound-condition real rate doesn't
#   match the existing flat CMP weight), flagged separately in
#   OPEN_QUESTIONS.md rather than rushed into this fix.
cpt_expression:
  base_read: 88
  operator_tier_costs:
    "+": 36
    "-": 36
    "*": 52
    "/": 52
    MOD: 52
    "**": 116
  per_extra_same_tier_operand: 24
  # T1(ADD/SUB)+T2(MUL/DIV/MOD) mixed expression, wired 2026-08-26 from
  # gen_cpt_mixed_operators.py's real operand-count-scaling sweep (3/5/8/
  # 11/15 operands, alternating tiers): 4/5 points exact with zero
  # residual (k=2,4,10,14 operators), k=7 off by the same small universal
  # -8ish noise seen throughout this project. Order/arrangement doesn't
  # matter (grouped vs alternating give the same result at 4/5 counts).
  # ONLY applies when the operator SET present is exactly {T1, T2} (no
  # POW) -- T1T3, T2T3, and all-3-tier mixes each show their own real,
  # different behavior (see OPEN_QUESTIONS.md OQ-CMPCPTLAYOUT) and fall
  # back to the plain additive-sum approximation below instead.
  two_tier_mix_base: 100
  two_tier_mix_per_operator: 32
  # T1T3/T2T3 mixed expression (POW alongside exactly one of ADD/SUB or
  # MUL/DIV/MOD), wired 2026-08-25 -- OQ-CMPCPTLAYOUT. Real capture data
  # already existed (2026-08-24, gen_cpt_mixed_operators.py's
  # group_t1t3_t2t3_scaling) but was never reconciled into a formula.
  # T1T3 and T2T3 give IDENTICAL real bytes at every one of 5 tested
  # operator counts (2/4/7/10/14) -- once POW is present, whether the
  # OTHER tier is T1 or T2 makes no measurable difference, so one formula
  # covers both pairs. 4 of 5 points exact (k=2,4,10,14), k=7 off by the
  # same +16 this project's other CPT formulas also miss by at that
  # specific operator count. All-3-tier mixes remain unresolved (see
  # OPEN_QUESTIONS.md OQ-CMPCPTLAYOUT), fall back to the additive-sum path.
  pow_tier_mix_base: 160
  pow_tier_mix_per_operator: 64

# Operand-type surcharge (OQ-OPERANDTYPE, wired 2026-08-26, James: "touch
# these and finalize them now"). Every weight in `logic_instructions.
# weights` below was fit against DINT-operand sweeps -- real data
# (typesweep_<instr>_<type>_n01000, 69 real captures, error_count=0,
# matched shape/tag-count per instruction) shows SINT/INT/REAL/STRING
# operands genuinely cost more (or, for LIM+REAL, slightly less) than
# DINT. LINT ties DINT exactly everywhere tested (0 surcharge, omitted).
# Derivation: live-recomputed each typesweep file's delta against the
# CURRENT engine (predicted using the base DINT-rate weight), divided by
# the file's 1000-rung count -- e.g. ADD+SINT: delta=132,005 at n=1000 ->
# 132/rung surcharge (the leftover +5 is the same tiny flat cross-file
# baseline noise seen elsewhere in this project, not per-rung).
#
# CONFIDENCE IS FITTED, NOT KNOWN -- unlike CPT's operator tiers (each
# cross-validated at n=10/n=100/n=1000), every number here comes from a
# SINGLE count point (n=1000 only). The round, clean values (multiples of
# 4, matching this project's usual "blocks" quantization) are a good sign,
# but linearity itself is assumed, not independently confirmed the way
# CPT's was. Needs a 2nd count point per instruction/type before this
# earns KNOWN.
#
# Application (sizing/logic.py): resolves EACH type-sensitive call's
# operands against the tag table; if a bare-tag operand resolves to a
# type with a nonzero entry below, that surcharge is added ONCE per call
# on top of the call's normal weights[mnemonic] base cost. Deliberately
# does NOT attempt to resolve a member-access ("Tag.Member"), array-index
# ("Tag[0]"), or literal operand's type -- none of those appear in the
# calibration data (every typesweep_* file uses bare bare-tag operands of
# one uniform type throughout the call), so guessing their behavior would
# violate this project's rule against inventing untested Rockwell
# behavior. A call with an unresolvable or mixed-type operand set falls
# back to the existing DINT-rate weight, same as before this change --
# an honest "don't know" rather than a wrong guess.
operand_type_surcharge:
  confidence: FITTED
  surcharges:
    ADD: {SINT: 132, INT: 156, REAL: 16}
    SUB: {SINT: 132, INT: 156, REAL: 16}
    MUL: {SINT: 132, INT: 156, REAL: 0}
    DIV: {SINT: 132, INT: 156, REAL: 0}
    MOD: {SINT: 132, INT: 156, REAL: 0}
    EQU: {SINT: 88, INT: 112, REAL: 0, STRING: 52}
    GEQ: {SINT: 88, INT: 112, REAL: 16}
    GRT: {SINT: 88, INT: 112, REAL: 16}
    LEQ: {SINT: 88, INT: 112, REAL: 16}
    LES: {SINT: 88, INT: 112, REAL: 16}
    NEQ: {SINT: 88, INT: 112, REAL: 0, STRING: 52}
    MOV: {SINT: 92, INT: 104, REAL: 24}
    LIM: {SINT: 128, INT: 164, REAL: -8}

# Indirect (tag-driven) array-index cost (OQ-INDIRECT, wired 2026-08-26).
# CONFIRMED KNOWN -- 4 real count points each (10/50/100/1000 rungs),
# every single one exact once the same tiny universal +4 flat baseline
# noise seen elsewhere in this tag pool is set aside (direct_index's own
# n=1000 point shows the identical +4, confirming it's unrelated to
# indexing at all): tag_index_cost solved exactly from n=10/n=1000
# (84/rung, F=4) and independently reproduces n=50/n=100 with zero
# residual; tag_offset_index_cost the same way (108/rung, F=4). A direct/
# literal index ("Arr[5]") costs nothing extra -- confirmed via
# indirect_direct_index_n01000's own flat +4 (identical noise, no growth).
indirect_index:
  confidence: KNOWN
  tag_index_cost: 84
  tag_offset_index_cost: 108

# CMP's own surcharges (wired 2026-08-26). The existing flat CMP:76 below
# is CONFIRMED EXACT for a single simple condition -- live-recomputed
# against the current engine: cmpcpt_cmp_single_n00100 delta=0, n01000
# delta=-264 (the same already-understood large-file anomaly seen
# elsewhere, not a formula error). The "CMP's compound-condition rate
# doesn't match its own wired weight" note from an earlier pass was a
# manual-arithmetic error on this project's part, not a real
# inconsistency -- corrected here, CMP:76 stays as-is.
#
# COMPOUND condition (2+ clauses via && or ||): +64/rung, CONFIRMED KNOWN
# -- exact at BOTH n=100 (delta=6400/100=64) and n=1000 (delta=64000/1000
# =64), zero residual at either point (no large-file anomaly here,
# unlike the single-condition case above -- genuinely doesn't always
# recur). AND/OR/a duplicated clause all cost the identical +64, so this
# doesn't distinguish which logical connective, just "more than one
# clause." Only ever tested with exactly 2 clauses/1 connective -- 3+
# clauses is untested, not assumed to scale the same way.
#
# FLOAT-literal comparison: +72/rung, FITTED not KNOWN -- only one count
# point (n=1000). An int-literal comparison costs nothing extra (matches
# CPT's own int-literal finding). Applied ADDITIVELY with the compound
# surcharge if a call has both -- never actually tested together, an
# assumption, not a confirmed combination.
cmp_surcharge:
  compound_confidence: KNOWN
  compound_cost: 64
  float_literal_confidence: FITTED
  float_literal_cost: 72

# Task/Program/Routine SHELL decomposition (WIRED 2026-08-27, OQ item "Per-
# Task overhead" in docs/OPEN_QUESTIONS.md). fixed_base_per_routine (4816,
# above) is a real, KNOWN, hundreds-of-times-confirmed constant for the
# BASELINE case (1 Task, 1 Program, 1 plain routine, 0 rungs) -- but it was
# being applied ONCE PER EMITTED ROUTINE regardless of Task/Program
# structure, which over-predicts any file with more than one plain routine
# (a 2-plain-routine/1-program/1-task file doesn't cost 2x4816 of shell, it
# costs 4816 + a much smaller marginal routine cost). This block is that
# marginal cost, split into three independent axes and applied ONCE per
# file total (see report.py) as: fixed_base_per_routine (once, whenever the
# file has >=1 plain routine) + task_extra*(n_tasks-1) +
# program_extra*(n_programs-1) + routine_extra*(n_plain_routines-1).
#
# Derivation -- solved from 5 real files, all exact or near-exact, no
# theoretical/assumed baseline used anywhere in the solve:
# `programoverhead_n02progs_1task` (1 task/2 programs/2 routines, actual
# 18,900) minus `taskoverhead_n02routines_1program_1task` (1 task/1
# program/2 routines, actual 18,416) holds task AND routine count IDENTICAL
# between the two files, varying ONLY program count -- a real, isolated
# **program_extra = +484**, no assumptions. `taskoverhead_n02tasks` (2
# tasks/2 programs/2 routines, actual 19,600) minus the program-overhead
# file above holds program AND routine count IDENTICAL, varying ONLY task
# count -- **task_extra = +700**, same isolation. routine_extra solved
# directly against `taskoverhead_n02routines_1program_1task` itself (1
# task, 1 program, 2 routines, 2 NOP rungs): actual(18,416) = project_
# baseline(13,296) + fixed_base_per_routine(4,816, ONCE) + routine_extra*
# (2-1) + 2*NOP(16 each, unrelated rung-content cost, unchanged/separate
# mechanism) => **routine_extra = 272**. This is the fix the 2026-08-26
# "why am I having to push you" note called for: earlier attempts anchored
# the routine-shell subtraction on a THEORETICAL 0-rung reference and
# risked conflating real NOP rung content with routine-shell cost; this
# derivation instead anchors on the already-KNOWN, real fixed_base_per_
# routine and handles rung content via the existing, unchanged, separate
# per-rung mechanism -- no double-counting.
#
# Verified against all 3 real disentangle-batch files exactly (0 residual)
# AND against the original taskoverhead_n02/n03/n04tasks sweep (each Task
# gets its own Program+Routine+1 rung): n=2 exact, n=3 exact, n=4 off by
# only +48 (0.21%) -- a small, already-flagged, unexplained periodic-task
# residual, not chased further.
#
# Deliberately does NOT touch the separately-validated JSR pathway: a
# JSR-caller routine keeps charging jsr_fixed_base_per_routine exactly as
# before (report.py only applies this new decomposition when the file has
# at least one PLAIN, non-JSR-involved routine to anchor the once-per-file
# shell on -- a file whose only routines are JSR callers/targets is
# untouched, same as before this fix). A file mixing JSR-caller routines
# WITH plain routines across a multi-Task/multi-Program structure is
# untested territory -- flagged, not guessed at.
task_program_overhead:
  routine_extra: 272
  program_extra: 484
  task_extra: 700
  confidence: FITTED

logic_instructions:
  fixed_base_per_routine: 4816
  jsr_fixed_base_per_routine: 5096  # JSR's routine also declares the target subroutine
  confidence: FITTED
