# Predefined structures whose real cost is base + per_element*array_length
# rather than a flat scalar -- CAM_PROFILE is always used as an array in
# real Logix (a cam profile IS a point array). Derived 2026-08-23 from
# gen_motion_predefined.py's 1/5/20/50-element real count sweep: exact
# linear fit (0 residual) once empty_project_baseline + tag_overhead
# subtracted. per_element=56 = 14 fields x 4 bytes, matching the earlier
# corpus finding (OQ-PREDEFINED) that only 1 of 14 real per-element L5K
# fields is visible in the Decorated XML -- this empirical fit independently
# confirms that field count.
predefined_array_structures:
  CAM_PROFILE: { base: 4, per_element: 56, confidence: FITTED }
  # CAM (used by MCCP/MAPC's cam-profile operand -- NOT CAM_PROFILE, a
  # different predefined structure with a different real shape, see the
  # CAM_PROFILE entry above and OPEN_QUESTIONS.md OQ-PREDEFINED item 8).
  # Wired 2026-08-26 from gen_cam_sweep.py's real 5-point count sweep
  # (n=1/5/10/20/50, error_count=0 throughout): exact at n=1 and n=5, a
  # flat -4 (already-familiar small universal noise, seen throughout this
  # project) at n=10/20/50 -- clean enough for KNOWN. Matches the
  # mechanistic prediction made before this data existed: CAM's own L5K
  # format shows no hidden fields (unlike CAM_PROFILE), so a clean
  # base+12*count (not CAM_PROFILE's much larger 56/element, which DOES
  # hide fields) was the expected shape, now confirmed.
  CAM: { base: 8, per_element: 12, confidence: KNOWN }

# Fixed per-project overhead the sizing engine never modeled before
# 2026-08-23 -- controller/module/task/program scaffolding that exists in
# every real Capacity-tab reading regardless of tag/UDT/logic content, so
# every engine total silently under-predicted real actual_bytes by this
# exact amount. Derived by cross-checking this engine's own fresh
# recomputation (not the possibly-stale predicted_bytes column already
# sitting in manifest.csv) against actual_bytes for every clean real data
# point in the 2026-08-22/23 capture batch: the gap is EXACTLY 13,296
# across 200+ independent points spanning wildly different categories
# (tag_overhead sweeps, UDT-name sweeps, tagscope, boolarray, udtarrayalign,
# comment-length sweeps) with zero variance -- not a fitted average, a
# literal constant. A handful of categories (the 244-file logic-instruction
# sweep, customstring, array-of-odd-UDT) show a small +4 to +206 ADDITION on
# top of this same 13,296 floor, each independently explained elsewhere in
# this file (customstring_definition_cost, the logic-instruction weight
# table's own fixed_base_per_routine) -- 13,296 is the true floor, not an
# average across those.
empty_project_baseline:
  bytes: 13296
  confidence: KNOWN

# Per-module overhead (2026-08-27, OQ-MODULEIO, James's own methodology:
# compare a module's auto-generated "Module-Defined" data type -- the raw
# member-sum of its InputTag/OutputTag/ConfigTag Structure content, exactly
# like sizing any other UDT -- against its real captured Capacity delta).
# FITTED from only 2 real points so far, flagged LOW CONFIDENCE deliberately
# -- see docs/OPEN_QUESTIONS.md OQ-MODULEIO for the full derivation and why
# more points are needed before trusting this as a real formula:
#   1756-IB16: module_defined_bytes=28, real actual=1712 -> overhead=1684
#   1734-AENTR/C: module_defined_bytes=36, real actual=1696 -> overhead=1660
# Both land within 24 bytes of each other despite very different module
# types (a 16-pt digital backplane module vs a 14-slot Point I/O Ethernet
# adapter) and very different module_defined_bytes (28 vs 36) -- the
# overhead doesn't obviously track the module's own I/O content size, so a
# flat constant (the mean of the 2 points) is the current best estimate,
