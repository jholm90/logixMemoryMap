# captured for each): B(n) = 4 + 20*n (the true per-call-site marginal
# rate, confirmed exact at all 3 points, including n=8 landing exactly on
# the 2-point line derived from n=5/n=10 -- real evidence the linear-in-n
# model generalizes). A(n) = 104 + 20*n (a one-time cost, likely the
# target routine's own Parameters-block declaration, charged once per
# distinct JSR target regardless of call-site count) -- solved from the
# same n=5/n=10 pair; not independently re-confirmed at n=8 this pass.
# See docs/OPEN_QUESTIONS.md OQ-JSRPARAMCOST.
